[project]
name = "football"
version = "0.1.0"
description = "Premier League analytics: xG, recruitment, pressing and FPL value, from free data sources."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
    "mplsoccer>=1.4,<2",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "statsbombpy>=1.14,<2",
]

[project.scripts]
football = "football.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[tool.uv]
# uv before 0.12 wrote its editable-install .pth files with the macOS
# UF_HIDDEN flag set, and CPython 3.13's site.addpackage() skips hidden .pth
# files. The combination silently breaks `import football` on macOS with a
# bare ModuleNotFoundError. Verified: 0.8.22 broken, 0.12.13 fine.
required-version = ">=0.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football"]

[tool.ruff]
line-length = 90
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
